plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smarttv.webview'
    compileSdk 33

    defaultConfig {
        applicationId "com.smarttv.webview"
        minSdk 21  // Compatible con la mayoría de Smart TVs
        targetSdk 33  // Android 13
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true  // Optimización para reducir tamaño
            shrinkResources true  // Eliminar recursos no utilizados
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Optimizaciones para dispositivos de bajos recursos
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    
    // Leanback para soporte de TV
    implementation 'androidx.leanback:leanback:1.0.0'
}
